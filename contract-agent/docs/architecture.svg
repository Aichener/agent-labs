<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1070" viewBox="0 0 1180 1070" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
  </marker>
</defs>
<rect width="1180" height="1070" fill="#ffffff"/>
<text x="40" y="42" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="21" font-weight="700" fill="#1f2328">contract-agent 架构</text>
<text x="40" y="66" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#57606a">Plan-and-Execute：模型负责规划，执行 / 校验 / 判定在代码里；虚线为回流路径</text>
<rect x="60" y="96" width="430" height="64" rx="9" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
<text x="275.0" y="118" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">请求</text>
<text x="275.0" y="138" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#57606a">doc_id / text / file_b64 + rules</text>
<rect x="60" y="196" width="430" height="64" rx="9" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
<text x="275.0" y="218" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">入参预检（HITL）</text>
<text x="275.0" y="238" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#57606a">文档或规则缺失 → 直接提问，不调模型</text>
<rect x="60" y="306" width="430" height="64" rx="9" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
<text x="275.0" y="328" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">Planner（LLM）</text>
<text x="275.0" y="348" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#57606a">输出 JSON 计划：tool / args / why</text>
<rect x="60" y="416" width="430" height="64" rx="9" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
<text x="275.0" y="438" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">Plan Validator</text>
<text x="275.0" y="458" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#57606a">工具名 · 参数 schema · 规则范围 · 末步 finalize</text>
<rect x="60" y="526" width="430" height="64" rx="9" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
<text x="275.0" y="548" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">Executor</text>
<text x="275.0" y="568" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#57606a">逐步执行 · 写 trace · 累计 tool_calls</text>
<rect x="60" y="636" width="430" height="64" rx="9" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
<text x="275.0" y="658" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">Tool Registry（5 个工具）</text>
<text x="275.0" y="678" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#57606a">JSON Schema · 幂等 · ToolError 分类</text>
<rect x="60" y="746" width="430" height="64" rx="9" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
<text x="275.0" y="768" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">Observation + Guardrails</text>
<text x="275.0" y="788" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#57606a">步数 12 · 工具 10 · 墙钟 30s · 重复调用</text>
<rect x="60" y="866" width="430" height="64" rx="9" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
<text x="275.0" y="888" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">Aggregator（确定性）</text>
<text x="275.0" y="908" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#57606a">按 severity 合成 pass / warn / fail</text>
<rect x="60" y="976" width="430" height="64" rx="9" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
<text x="275.0" y="998" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">落库与日志</text>
<text x="275.0" y="1018" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#57606a">SQLite 幂等 · JSONL 证据脱敏</text>
<rect x="700" y="196" width="400" height="64" rx="9" fill="#fff8c5" stroke="#bf8700" stroke-width="1.3"/>
<text x="900.0" y="218" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">need_clarification</text>
<text x="900.0" y="238" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#57606a">返回 questions，零工具调用</text>
<rect x="700" y="416" width="400" height="64" rx="9" fill="#fff8c5" stroke="#bf8700" stroke-width="1.3"/>
<text x="900.0" y="438" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">带错误让模型重出一次</text>
<text x="900.0" y="458" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#57606a">格式问题告诉模型，不直接兜底</text>
<rect x="700" y="526" width="400" height="64" rx="9" fill="#fff8c5" stroke="#bf8700" stroke-width="1.3"/>
<text x="900.0" y="548" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">Fallback Plan</text>
<text x="900.0" y="568" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#57606a">固定流程：extract → check×N → finalize</text>
<rect x="700" y="636" width="400" height="64" rx="9" fill="#fff8c5" stroke="#bf8700" stroke-width="1.3"/>
<text x="900.0" y="658" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">参数修复后重试一次</text>
<text x="900.0" y="678" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#57606a">去掉多余字段再调，仍失败记入 failures</text>
<rect x="700" y="746" width="400" height="64" rx="9" fill="#fbefff" stroke="#8250df" stroke-width="1.3"/>
<text x="900.0" y="768" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">停止并标记 stopped_by</text>
<text x="900.0" y="788" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#57606a">结果仍聚合，标记为不完整</text>
<rect x="700" y="866" width="400" height="64" rx="9" fill="#fbefff" stroke="#8250df" stroke-width="1.3"/>
