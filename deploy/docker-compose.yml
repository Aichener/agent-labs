# 两个服务一起起：docker compose -f deploy/docker-compose.yml up -d --build
#
# 结果库落在命名卷里，删容器不丢；语料和代码在镜像里，不挂载。
# 注意：SQLite 是单写者，每个服务只能起一个副本，不要加 replicas。

services:
  contract-agent:
    build:
      context: ../contract-agent
    image: agent-labs/contract-agent:1.0
    container_name: contract-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AGENT_API_KEYS: ${AGENT_API_KEYS:?请先在 deploy/.env 里设置}
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: "8080"
      AGENT_TIMEOUT: "30"
      AGENT_DB: /app/state/tasks.db
      LLM_BASE_URL: ${LLM_BASE_URL:-http://127.0.0.1:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
    volumes:
      - contract-state:/app/state
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  doc-classify-agent:
    build:
      context: ../doc-classify-agent
    image: agent-labs/doc-classify-agent:1.0
    container_name: doc-classify-agent
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      AGENT_API_KEYS: ${AGENT_API_KEYS:?请先在 deploy/.env 里设置}
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: "8081"
      AGENT_TIMEOUT: "30"
      AGENT_DB: /app/state/tasks.db
    volumes:
      - classify-state:/app/state
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  contract-state:
  classify-state:
