# 反向代理示例：TLS 终止、限体积、给足超时。
# 用法：把 upstream 换成实际地址，证书路径改成自己的，然后 nginx -s reload。
#
# 不做的部分：限流（用到时再加 limit_req）、鉴权（服务自己校验 X-API-Key）、
# WAF 与审计（按所在环境补）。

upstream contract_agent {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream doc_classify_agent {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name agent.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 服务端请求体上限是 8MB，这里留一点余量
    client_max_body_size 10m;
    client_body_timeout  60s;

    # 健康检查不转发到业务，直接回 200，避免探活打到服务上
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://contract_agent;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 服务端单请求 30s 超时，这里给到 60s，让 504 由服务自己返回
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

# 分级服务单独一个域名；也可以换成 location /classify/ 前缀
server {
    listen 443 ssl;
    http2 on;
    server_name classify.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://doc_classify_agent;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

# 80 端口只做跳转
server {
    listen 80;
    server_name agent.example.com classify.example.com;
    return 301 https://$host$request_uri;
}
